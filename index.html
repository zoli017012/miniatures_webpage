<!DOCTYPE html>
<html lang="hu">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Miniatures Gyűjtemény</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body onload="init()">

    <header class="top-navbar">
        <div class="logo-area">
            <span class="holo-icon" id="kör">⬤</span>
            <span class="holo-icon" id="rombusz">◆</span>
            <span class="holo-icon">★</span>
            <span class="holo-icon">✪</span>
            <h1>MINIATURE <span>GYŰJTEMÉNY</span></h1>
            <span id="total-quantity-span"></span>
        </div>


        <ul class="nav-links">
            <li>
            <a href="#" class="nav-item" onclick="showGeneralStatisticsModal(this)">
                <i class="fas fa-times"></i>
                <span>Statisztika</span>
            </a>
            </li>
            <li>
            <a href="#" class="nav-item active" onclick="loadCardsByState('Missing', this)">
                <i class="fas fa-times"></i>
                <span>Hiányzik</span>
            </a>
            </li>
            <li>
            <a href="#" class="nav-item" onclick="loadCardsByState('Owned', this)">
                <i class="fas fa-check"></i>
                <span>Megvan</span>
            </a>
            </li>
            <li>
            <a href="#" class="nav-item" onclick="loadCardsByState('Wanted', this)">
                <i class="fas fa-shopping-cart"></i>
                <span>Kell</span>
            </a>
            </li>
            <li>
            <a href="#" class="nav-item" onclick="loadFavoriteCards(this)">
                <i class="fas fa-star"></i>
                <span>Kedvencek</span>
            </a>
            </li>
            <li>
            <a href="teambuilder.html" class="nav-item">
                <i class="fas fa-helmet-safety"></i>
                <span>Csapatépítő</span>
            </a>
            </li>
            <li>
            <a href="maps.html" class="nav-item">
                <i class="fas fa-map"></i>
                <span>Térképek</span>
            </a>
            </li>
        </ul>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Kártya keresése..." onkeyup="filterCards()">
            <span class="search-icon">🔍</span>
        </div>
    </header>

    

    <div class="app-container">
        <nav class="sci-fi-sidebar">
            
            <div class="filter-section">
                <div class="sidebar-header">
                    Rendezés szerint
                </div>
                <select class="custom-select" onchange="applyOrdering(this.value)">
                    <option value="date-asc">Dátum: Növekvő</option>
                    <option value="date-desc">Dátum: Csökkenő</option>
                </select>
            </div>
            
            <div class="sidebar-header">
                Szettek
            </div>
            <ul class="sidebar-menu" id="set_list">
            </ul>
            
            <div class="sidebar-header" style="margin-top: 20px;">
                Frakciók
            </div>
            <ul class="sidebar-menu" id="fraction_list">

            </ul>
            <div class="sidebar-header" style="margin-top: 20px;">
                Ritkaság
            </div>
            <ul class="sidebar-menu" id="rarity_list">

            </ul>
        </nav>

        <main class="main-content">
            <video class="bg-video" autoplay loop muted playsinline src="backgrounds//test.mp4" type="video/mp4">
            </video>
            <div class="scroll-area">
                <div id="card-container">
                    <div id="test-card">
                        <img src="babu_atlatszo.png" alt="" id="test-image">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <dialog id="myModal">
        <div id="modalContent"></div>
    </dialog>

    <script src="variables.js"></script>
    <script src="script.js"></script>
</body>
</html>
