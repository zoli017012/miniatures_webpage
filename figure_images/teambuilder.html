<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Miniatures Gyűjtemény</title>
    <link rel="stylesheet" href="style.css">
    <!-- Star Wars hangulatú betűtípus a Google Fonts-ról -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
</head>
<body onload="init()">

    <!-- Fejléc (Header) -->
    <header class="app-header">
        <div class="logo-area">
            <span class="holo-icon" id="kör">⬤</span>
            <span class="holo-icon" id="rombusz">◆</span>
            <span class="holo-icon">★</span>
            <span class="holo-icon">✪</span>
            <h1>MINIATURE <span>CSAPATÉPÍTŐ</span></h1>
        </div>

        <!-- Szűrő gombok -->
        <nav class="nav-buttons">
            <a href="index.html"><button class="sw-btn" onclick="loadCardsByState('Missing')">Főoldal</button></a>
            <button class="sw-btn" onclick="loadCardsByState('All', 'Összes', 'Összes', 115)">Összes</button>
            <button class="sw-btn" onclick="showCreationWindow()">Csapat létrehozás</button>
            <button class="sw-btn" onclick="showModifyingWindow()">Csapat módosítás</button>
            
            <select onchange="loadTeam(this.value)" id="team-selector" class="sw-btn">
            </select>
            <span class="sw-btn" id="point_stat"></span>
        </nav>

        <!-- Keresőmező -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Kártya keresése..." onkeyup="filterCards()">
            <span class="search-icon">🔍</span>
        </div>
    </header>

    

    <!-- Fő elrendezés: Oldalsáv + Tartalom -->
    <div class="app-container">
        <!-- Oldalsáv (Sidebar) -->
        <nav class="sci-fi-sidebar">
            
            <!-- RENDEZÉS SZERINT -->
            <div class="filter-section">
                <div class="sidebar-header">
                    Rendezés szerint
                </div>
                <select class="custom-select" onchange="applyOrdering(this.value)">
                    <option value="score-asc">Pontszám: Növekvő</option>
                    <option value="score-desc">Pontszám: Csökkenő</option>
                </select>
            </div>
            
            
            <div class="sidebar-header">
                Frakciók
            </div>
            <ul class="sidebar-menu" id="fraction_list">

            </ul>
            <div class="sidebar-header" >
                <div class="search-box">
                    <input type="text" id="skill_search" placeholder="Képesség keresése..." onkeyup="filterSkills()">
                    <span class="search-icon">🔍</span>
                </div>
            </div>
            <ul class="sidebar-menu" id="skill_list">

            </ul>
            <div class="sidebar-header" >
                Szűrők
            </div>
                <div class="filter-section">
                    <div class="accordion-header">
                        <span class="accordion-title">Pontszám Tartomány</span>
                        <span class="accordion-icon">&#9650;</span> <!-- Felfelé mutató nyíl ikon -->
                    </div>
                    
                    <div class="range-container">
                        <div class="bubble-container">
                            <span class="bubble min-bubble" id="min-bubble">0</span>
                            <span class="bubble max-bubble" id="max-bubble">115</span>
                        </div>

                        <div class="slider-track-container">
                            <div class="slider-track"></div>
                            <div class="slider-progress" id="slider-progress"></div> 
                            
                            <input type="range" min="0" max="115" value="0" class="range-input" id="min-range">
                            <input type="range" min="0" max="115" value="115" class="range-input" id="max-range">
                        </div>
                        
                        <div class="slider-labels">
                            <span>0</span>
                            <span>115</span>
                        </div>

                        <div class="min-max-inputs">
                            <div class="input-group">
                                <label>MIN</label>
                                <input type="number" value="0" id="min-input" min="0" max="115">
                            </div>
                            <div class="input-group">
                                <label>MAX</label>
                                <input type="number" value="115" id="max-input" min="0" max="115">
                            </div>
                        </div>
                    </div>
                </div>
                <button class="sw-btn" onclick="sortCharsByPoint()">Rendezés</button>
                
            
        </nav>

        <!-- Fő tartalom: A kártyák hálója -->
        <main class="main-content">
            <div id="card-container">
                <div id="test-card">
                    <img src="babu_atlatszo.png" alt="" id="test-image">
                </div>
            </div>
        </main>
    </div>

    <!-- Modális ablak -->
    <dialog id="myModal">
        <div id="modalContent"></div>
    </dialog>

    <script src="merged_with_id.js"></script>
    <script src="teambuilder_script.js"></script>
</body>
</html>
